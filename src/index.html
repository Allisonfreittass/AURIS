<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Force Chromium to render native form controls (select dropdowns,
         autofill highlights, scrollbar fallback) in dark mode. Set before
         any CSS so the very first paint uses dark chrome. -->
    <meta name="color-scheme" content="dark" />
    <!-- CSP is applied at session level in electron/main/index.ts so we can
         emit different policies for dev (Vite HMR-friendly) vs prod (strict). -->
    <title>Auris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
