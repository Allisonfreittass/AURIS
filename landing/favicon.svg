<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  width="512"
  height="512"
  role="img"
  aria-label="Auris"
>
  <!-- Rounded-square dark background. Radius 22% matches the macOS/iOS
       app-icon template; works fine on Windows taskbar too. Slightly
       lighter than pure ink so the icon doesn't disappear against
       dark-mode Windows taskbars. -->
  <rect width="120" height="120" rx="26" fill="#161a20" />

  <!-- Five EQ bars: three blue ascending, two teal descending. Centered
       horizontally with a shared baseline at y=90 for visual stability.
       Same waveform mark used everywhere else in the brand system. -->
  <rect x="25" y="50" width="9" height="40" rx="2" fill="#1a6cf0" opacity="0.45" />
  <rect x="40" y="33" width="9" height="57" rx="2" fill="#1a6cf0" opacity="0.7" />
  <rect x="55" y="18" width="9" height="72" rx="2" fill="#1a6cf0" />
  <rect x="70" y="33" width="9" height="57" rx="2" fill="#0db8a0" opacity="0.85" />
  <rect x="85" y="45" width="9" height="45" rx="2" fill="#0db8a0" opacity="0.55" />
</svg>
